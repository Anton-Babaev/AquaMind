# Конфигурация Edge-контроллера для Raspberry Pi 3 B+ (боевой режим).
# Отличия от edge.yaml (ноутбук/разработка):
#   - hardware: gpio (реальные светодиоды через go-rpio);
#   - scenario.path указывает на edge/scenarios/ (структура репозитория);
#   - allowed_cidrs включает ::1/128 (kiosk-браузер на Pi ходит через IPv6).
# Значения порогов — [TBD], уточняются при реализации.

client_id: edge-01

# Адаптер выходов (светодиодов):
#   console — «лампочки» в терминале (разработка на ноутбуке);
#   gpio    — реальные светодиоды на Raspberry Pi через go-rpio.
hardware: gpio

# Раскладка BCM-пинов (используется только при hardware: gpio).
gpio:
  heating: 17   # 🟡 подогрев, физ. пин 11
  alarm: 27     # 🔴 тревога,  физ. пин 13
  normal: 22    # 🟢 норма,    физ. пин 15

backend:
  # Публичный адрес Backend-сервера (через nginx на порту 80).
  # Малина на ферме ходит в интернет по Wi-Fi, поэтому указываем внешний IP.
  url: "http://5.63.153.76"
  sync_interval: 10s        # тик SyncWorker
  request_timeout: 5s
  batch_size: 100           # максимум записей в одном пакете

polling:
  interval: 2s              # тик SensorPoller (демо: 1–5 с)

safety:
  interval: 1s              # тик SafetyWatchdog
  stale_after: 10s          # данные старше — Safe Mode

scenario:
  path: "edge/scenarios/day_cycle.csv"
  speed: 60                 # ускорение времени (1 сек реального = N сек сценария)
  loop: true

storage:
  path: "data/edge.db"      # SQLite (WAL)
  busy_timeout: 5s
  retention: 24h            # удаление отправленных записей старше

control_plane:
  listen: ":8081"
  # Подсети, которым разрешён доступ к control plane (только LAN).
  allowed_cidrs:
    - "127.0.0.1/32"
    - "::1/128"
    - "192.168.0.0/16"
    - "10.0.0.0/8"

# Пороги и гистерезис правил — [TBD].
thresholds:
  # Температура, °C
  temp_low: 22.0
  temp_low_hysteresis: 1.0
  temp_critical_low: 18.0
  temp_critical_high: 30.0
  # Кислород, мг/л
  o2_low: 5.0
  o2_high: 9.0
  o2_low_hysteresis: 0.5
  # Поток, л/мин
  flow_min: 5.0
  # pH (допустимый диапазон)
  ph_low: 6.5
  ph_high: 8.5


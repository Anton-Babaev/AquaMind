# nginx-конфиг для Backend AquaMind.
#
# Назначение: принимать запросы снаружи на порту 80 и проксировать их на
# бэкенд, который слушает только localhost:8080 (см. docker-compose.yml).
# Так бэкенд не торчит в интернет напрямую.
#
# Установка (Ubuntu/Debian):
#   sudo apt install -y nginx
#   sudo cp backend/deploy/nginx.conf /etc/nginx/sites-available/aquamind
#   sudo ln -sf /etc/nginx/sites-available/aquamind /etc/nginx/sites-enabled/aquamind
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Когда появится домен — добавить server-блок на 443 с сертификатом
# (certbot --nginx) и редирект с 80 на 443.

server {
    listen 80;
    listen [::]:80;

    # Пока домена нет — принимаем запросы на любой Host (в т.ч. по IP).
    server_name _;

    # Размер тела запроса: пакет синхронизации от Edge небольшой,
    # но дадим запас (batch_size=100 тиков).
    client_max_body_size 4m;

    # Проксируем всё на бэкенд.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты: бэкенд отвечает быстро, но дадим запас.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}

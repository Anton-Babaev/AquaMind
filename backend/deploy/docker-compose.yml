# docker-compose для Backend AquaMind (PostgreSQL + backend) на VPS (reg.ru).
#
# Запуск:
#   cp backend/deploy/env.example backend/deploy/.env   # и заполнить секреты
#   docker compose -f backend/deploy/docker-compose.yml --env-file backend/deploy/.env up -d --build
#
# Логи:   docker compose -f backend/deploy/docker-compose.yml logs -f backend
# Стоп:   docker compose -f backend/deploy/docker-compose.yml down
#
# Порты: backend слушает 8080 на хосте (наружу). PostgreSQL НЕ публикуется
# наружу — доступен только внутри docker-сети (безопасно).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquamind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aquamind}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquamind} -d ${POSTGRES_DB:-aquamind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # DSN собирается из переменных postgres-сервиса (хост = имя сервиса).
      AQUAMIND_BACKEND_POSTGRES_DSN: "postgres://${POSTGRES_USER:-aquamind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aquamind}?sslmode=disable"
      AQUAMIND_BACKEND_LISTEN: ":8080"
      AQUAMIND_BACKEND_TG_TOKEN: ${AQUAMIND_BACKEND_TG_TOKEN:-}
      AQUAMIND_BACKEND_TG_CHAT_ID: ${AQUAMIND_BACKEND_TG_CHAT_ID:-}
      AQUAMIND_BACKEND_NOTIFY_COOLDOWN: ${AQUAMIND_BACKEND_NOTIFY_COOLDOWN:-5m}
    ports:
      - "8080:8080"

volumes:
  pgdata:
